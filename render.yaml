# Render blueprint for the AgentGram gateway.
#   render.com → New → Blueprint → point at this repo
#
# A web service, not a cron or a function: the gateway holds a Hedera gRPC connection,
# serializes relayer nonces, keeps inbox streams open and runs a health monitor on a timer.
#
# Plan note: `free` sleeps after 15 minutes idle and carries no persistent disk. That is
# survivable here — the local store is a cache the indexer rebuilds from chain — but a cold
# start adds ~30-60s to the first request after a sleep, which an impatient caller may time
# out on. Switch to `starter` and uncomment the disk block to keep it warm and persistent.
services:
  - type: web
    name: agentgram-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    # disk:                      # requires plan: starter or above
    #   name: agentgram-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: PORT
        value: 8402
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_URL
        sync: false              # set to the Render URL once it exists, e.g. https://agentgram-gateway.onrender.com

      # ── Algorand x402 rail (the Global x402 Challenge) ──────────────────────
      # AVM_ADDRESS is a PUBLIC Algorand address, not a key. The server never signs
      # an Algorand transaction; the facilitator verifies and settles. The address
      # must be opted into USDC ASA 31566704 or payments cannot land, and it must
      # stay the same for the whole competition.
      - key: X402_CHAIN
        value: algorand
      - key: ALGORAND_NETWORK
        value: mainnet
      - key: AVM_ADDRESS
        sync: false
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: X402_CHALLENGE_TAG
        value: x402-global-challenge

      # ── Hedera: the message bus ─────────────────────────────────────────────
      - key: HEDERA_NETWORK
        value: testnet
      - key: HEDERA_ACCOUNT_ID
        sync: false
      - key: HEDERA_PRIVATE_KEY
        sync: false

      # ── Base: the identity registry ─────────────────────────────────────────
      - key: REGISTRY_ADDRESS
        sync: false
      - key: REGISTRY_CHAIN_ID
        value: 84532
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org

      # ── Blinding keys: rotating these orphans existing sealed routing ───────
      - key: SHARD_TAG_KEY
        generateValue: true
      - key: INBOX_TAG_KEY
        generateValue: true

      # ── Checkpoint key: SET THIS BY HAND AND KEEP A BACKUP ──────────────────
      # Encrypted checkpoints are what survives a redeploy on a disk-less plan, and this is
      # the key they are sealed with. `sync: false` rather than `generateValue: true` on
      # purpose: a generated value is regenerated whenever the service is recreated from
      # this blueprint, and every existing checkpoint would become permanently unreadable.
      # Without it set, the key falls back to SHARD_TAG_KEY, which has exactly that problem.
      #   generate one with:  openssl rand -base64 32
      - key: CHECKPOINT_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true

      # ── Alerting ────────────────────────────────────────────────────────────
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
